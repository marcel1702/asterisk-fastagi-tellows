name: Build and publish Docker image

# Baut das Image automatisch und schiebt es nach ghcr.io
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]      # z.B. v1.1.3 -> erzeugt sauber versionierte Tags
  workflow_dispatch:         # erlaubt manuelles Auslösen im Actions-Tab

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # noetig, damit der Workflow nach ghcr.io pushen darf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ghcr.io verlangt kleingeschriebene Image-Namen
      - name: Prepare image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatisch vorhanden, kein Setup noetig

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
