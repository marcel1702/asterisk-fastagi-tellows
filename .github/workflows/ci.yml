name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile tellows_agi.py

      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU is required to build the arm64 image on an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build both platforms the release publishes, so an arm64-only build
      # breakage is caught here instead of at release/tag time.
      - name: Build Docker image (multi-arch, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

      # Smoke test: load the amd64 image locally and confirm the module
      # imports (catches missing runtime deps / a broken entrypoint).
      # Dummy config is provided so config validation passes; importing the
      # module does not run the __main__ block, so no API call is made.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tellows-ci:smoke

      - name: Smoke test (import module)
        run: |
          docker run --rm \
            -e APIKEYMD5=dummy -e HOST=127.0.0.1 -e PORT=4573 -e TIMEOUT=2 \
            tellows-ci:smoke \
            python -c "import tellows_agi; print('import OK')"
